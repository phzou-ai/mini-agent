[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vermay-agent"
version = "0.1.0"
description = "An A2A-first main-agent runtime with a colocated web console."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.0",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/phzou-ai/vermay-agent"
Repository = "https://github.com/phzou-ai/vermay-agent"
Issues = "https://github.com/phzou-ai/vermay-agent/issues"

[project.scripts]
vermay-agent = "vermay_agent.main:main"
mini-agent = "vermay_agent.main:main"

[tool.setuptools.packages.find]
include = ["vermay_agent*", "mini_agent"]
